<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Crisp White Background -->
  <rect width="100" height="100" rx="20" fill="#FFFFFF"/>
  
  <!-- Codeyoung Geometric Icon Mark -->
  <g transform="translate(14, 10)">
    <!-- Top-left tilted yellow polygon -->
    <path 
      d="M14 2 L33 6 L25 46 L53 52 L49 71 L3 61 L14 2 Z" 
      fill="#FFE600" 
    />
    
    <!-- Bottom-right orange polygon -->
    <path 
      d="M9 71 H57 V36 H77 V91 H9 V71 Z" 
      fill="#FFA700" 
    />

    <!-- Overlapping intersection polygon (reddish-orange) -->
    <path 
      d="M53 46 L73 50 L69 71 L49 71 Z" 
      fill="#FF5511" 
      opacity="0.95"
    />
  </g>
</svg>
